# Quality gate for every pull request and every push to main.
# Only official actions (actions/*) are used. The job names `lint` and `e2e` are
# required status checks in the branch protection of main: do not rename them.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Colour contrast (WCAG AA) of the theme.json palette
        run: node scripts/check-contrast.mjs

      # PHP and Composer are preinstalled on GitHub's Ubuntu runners.
      - name: PHP version
        run: php --version && composer --version

      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP_CodeSniffer and WordPress Coding Standards
        run: composer install --no-interaction --no-progress

      - name: PHP syntax check
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: WordPress Coding Standards (phpcs.xml.dist)
        run: composer lint -- --report-full --report-summary --no-colors

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start WordPress and import demo content (npm run setup)
        run: npm run setup

      - name: Playwright — pages, navigation, axe-core, editor
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: WordPress logs
        if: ${{ failure() }}
        run: docker compose logs wordpress --tail=200
