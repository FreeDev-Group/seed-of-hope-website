# Deploys the theme, the core plugin and the mu-plugins to the Hostinger plan over FTPS (lftp).
#
# The plan has no SSH and hosts a single website, so there is no separate staging site:
# - every merge on main prepares a deployment to PRODUCTION, which waits for Samuel's approval
#   (required reviewer on the "production" environment);
# - Actions → Deploy → Run workflow allows a manual run, with a dry run option.
#
# Only our code is sent (scripts/deploy-ftp.sh). WordPress core, uploads, wp-config.php and the database
# are never touched. Secrets and variables of the "production" environment, see docs/deploiement.md:
#   secrets: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_PATH
#   variables: WP_URL
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "wp-content/**"
      - "scripts/deploy-ftp.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [production, staging]
        default: production
      dry_run:
        description: Only show what would change (nothing is uploaded or deleted)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.WP_URL }}
    # Never run two deployments to the same environment at the same time.
    concurrency:
      group: deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PATH: ${{ secrets.FTP_PATH }}
      FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'yes' }}
      WP_URL: ${{ vars.WP_URL }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      # Before the secrets exist, merges on main skip the deployment instead of failing.
      # A manual run fails loudly so a missing secret is noticed.
      - name: Check that the environment is configured
        id: config
        run: |
          missing=""
          for name in FTP_HOST FTP_USER FTP_PASSWORD FTP_PATH; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Missing secrets in this environment:$missing (see docs/deploiement.md)"
            exit 1
          else
            echo "::warning::Deployment skipped, missing secrets:$missing (see docs/deploiement.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload theme, plugin and mu-plugins (FTPS)
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: bash scripts/deploy-ftp.sh

      - name: Smoke test
        if: ${{ steps.config.outputs.ready == 'true' && env.DRY_RUN != '1' && env.WP_URL != '' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$WP_URL/")
          echo "Home page answered HTTP $code"
          test "$code" = 200

      - name: Reminder
        if: ${{ steps.config.outputs.ready == 'true' && env.DRY_RUN != '1' }}
        run: |
          echo "::notice::Files deployed. No SSH on this plan: if this is the first deployment, activate the theme and the 'Seed of Hope Core' plugin in wp-admin. If the site shows an old version, purge the cache in hPanel (Cache Manager)."
